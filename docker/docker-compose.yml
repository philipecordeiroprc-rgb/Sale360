version: "3.9"

services:
  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: sale360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sale360
      POSTGRES_PASSWORD: sale360dev
      POSTGRES_DB: sale360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sale360"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Valkey compatible)
  redis:
    image: redis:7-alpine
    container_name: sale360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sale360-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://sale360:sale360dev@postgres:5432/sale360
      REDIS_URL: redis://redis:6379
      JWT_SECRET: sale360-dev-secret-change-in-production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
      - /app/node_modules

  # Web Admin
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: sale360-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/.next

volumes:
  pgdata:
  redisdata:
