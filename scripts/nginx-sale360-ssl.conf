# ============================================================
# Sale360 — Nginx Config (DNS-safe + SSL)
# ============================================================

# DNS resolver — força re-resolução periódica, evita cache stale
resolver 1.1.1.1 8.8.8.8 169.254.169.254 valid=60s ipv6=off;
resolver_timeout 5s;

# Cloudflare real IP restoration
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream sale360_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream sale360_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ============================================================
# HTTP (port 80) — usado pelo Cloudflare e acesso direto
# ============================================================
server {
    listen 80;
    server_name sale360.jvp.app _;

    # Headers comuns
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ACME challenge (Let's Encrypt renewal)
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
    }

    # API proxy
    location /api/ {
        proxy_pass http://sale360_api;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://sale360_web;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # WebSocket support (Next.js HMR no dev, futuras features real-time)
    location /_next/webpack-hmr {
        proxy_pass http://sale360_web;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# HTTPS (port 443) — Cloudflare Full/Strict mode
# ============================================================
server {
    listen 443 ssl http2;
    server_name sale360.jvp.app;

    ssl_certificate /etc/letsencrypt/live/sale360.jvp.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sale360.jvp.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers comuns
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ACME challenge (Let's Encrypt renewal)
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
    }

    # API proxy
    location /api/ {
        proxy_pass http://sale360_api;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://sale360_web;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # WebSocket support
    location /_next/webpack-hmr {
        proxy_pass http://sale360_web;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# Health check endpoint (não faz proxy, responde direto)
# ============================================================
server {
    listen 8080;
    server_name sale360.jvp.app _;

    location / {
        return 200 "nginx OK\n";
        add_header Content-Type text/plain;
    }
}
