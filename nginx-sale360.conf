# ============================================================
# Sale360 — Nginx Config (DNS-safe)
# - Usa resolver explícito (Cloudflare + Google)
# - Upstream blocks com keepalive
# - Proxy /api/ e / na mesma origem (sem IP público hardcoded)
# ============================================================

# DNS resolver — força re-resolução periódica, evita cache stale
resolver 1.1.1.1 8.8.8.8 169.254.169.254 valid=60s ipv6=off;
resolver_timeout 5s;

upstream sale360_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream sale360_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Headers comuns
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API proxy
    location /api/ {
        proxy_pass http://sale360_api;
        # Se der 502, tenta próximo upstream (mesmo IP, mas retry rápido)
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://sale360_web;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;
    }

    # WebSocket support (Next.js HMR no dev, futuras features real-time)
    location /_next/webpack-hmr {
        proxy_pass http://sale360_web;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# Health check endpoint (não faz proxy, responde direto)
# ============================================================
server {
    listen 8080;
    server_name _;

    location / {
        return 200 "nginx OK\n";
        add_header Content-Type text/plain;
    }
}
